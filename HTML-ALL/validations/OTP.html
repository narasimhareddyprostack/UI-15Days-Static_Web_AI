<html>
    <head>
        <title>Validation Attributes</title>
    </head>
    <body>
        <h3>Generate OTP</h3>
        <form action="/otp">
            <label >Mobile Number:</label>
            <input type="text" required placeholder="Please Enter 10 Digit Mobile Number:" pattern="[6-9][0-9]{9}"> <br><br>
            <input type="submit" value="Send OTP">
        </form>
    </body>
</html>
