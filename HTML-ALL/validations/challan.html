<html>
    <head>
        <title>Vehicle Number Validation</title>
    </head>
    <body>
        <h3>Pay Challan online</h3>
        <form action="/find_challan">
            <label>Vehicle Number:</label>
            <input type="text" required pattern="^KA[0-9]{2}[a-zA-Z]{2}[0-9]{4}"/> <br>
            <input type="submit" value="Get Fine Details">
        </form>
    </body>
</html>
